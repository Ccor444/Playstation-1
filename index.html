<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  
  <title>PS3 XMB Emulator Interface</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Fonte adicionada para o tema Sakura Dream -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }

    html, body {
      margin: 0; padding: 0;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      width: 100vw; height: 100vh;
      overflow: hidden; overscroll-behavior: none;
      position: relative;
    }

    :root {
      --accent:         #38bdf8;
      --accent-soft:    rgba(56, 189, 248, 0.3);
      --accent-glow:    rgba(56, 189, 248, 0.4);
      --accent-border:  rgba(56, 189, 248, 0.8);
      --accent-text:    #7dd3fc;
      --menu-gradient-1:rgba(56, 189, 248, 0.55);
      --menu-gradient-2:rgba(3, 105, 161, 0.55);
      --xmb-text-glow:  rgba(56, 189, 248, 0.5);
      --font-display:   -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      --watermark-opacity: 0;
      --watermark-color: #38bdf8;
    }

    /* ============ MARCA D'ÁGUA ============ */
    #theme-watermark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(70vmin, 560px);
      height: min(70vmin, 560px);
      z-index: 11;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s;
      color: var(--watermark-color);
      filter: drop-shadow(0 0 30px var(--watermark-color));
    }
    body.xmb-open.theme-has-watermark #theme-watermark {
      opacity: var(--watermark-opacity);
      visibility: visible;
    }
    #theme-watermark svg { width: 100%; height: 100%; display: block; }
    #theme-watermark [stroke] { stroke: currentColor; }

    /* ============ FAÍSCAS ============ */
    #theme-embers {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    body.xmb-open.theme-has-embers #theme-embers {
      opacity: 0.9;
      visibility: visible;
    }

    .canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      display: flex; align-items: center; justify-content: center;
      background-color: #000;
    }
    #display { width: 100%; height: 100%; object-fit: contain; }

    #ps3-wave-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 10;
      pointer-events: none;
      opacity: 0; visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    #ps3-wave-canvas.active { opacity: 1; visibility: visible; }

    .xmb-overlay {
      visibility: hidden; opacity: 0;
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 50;
      display: flex; flex-direction: column;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
    }
    .xmb-overlay.active { visibility: visible; opacity: 1; pointer-events: auto; }

    .xmb-header {
      position: absolute;
      top: 25px; right: 35px;
      text-align: right;
      z-index: 60;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 8px var(--xmb-text-glow);
    }
    .xmb-clock {
      font-size: 26px; font-weight: 300; letter-spacing: 1px;
      font-family: var(--font-display);
    }
    .xmb-date { font-size: 11px; color: rgba(255, 255, 255, 0.65); margin-top: 2px; }

    .xmb-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      z-index: 55;
    }

    .xmb-horizontal-bar {
      display: flex; align-items: center;
      position: absolute;
      top: 22%; left: 18%;
      gap: 75px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .xmb-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      opacity: 0.35; transform: scale(0.85);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .xmb-nav-item.active {
      opacity: 1; transform: scale(1.25);
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }
    .xmb-nav-item .icon { 
      font-size: 28px; color: #fff;
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      transition: color 0.3s ease;
    }
    .xmb-nav-item.active .icon {
      color: var(--accent-text);
      text-shadow: 0 0 10px var(--accent-glow);
    }
    .xmb-nav-item .label {
      font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; font-weight: 700;
      white-space: nowrap;
      font-family: var(--font-display);
    }

    .xmb-vertical-list {
      position: absolute;
      top: 38%; left: 18%;
      display: flex; flex-direction: column; gap: 14px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .xmb-sub-item {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      opacity: 0.35; transform: scale(0.92);
      transform-origin: left center;
      transition: all 0.25s ease;
      cursor: pointer;
      min-width: 260px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }
    .xmb-sub-item.active {
      opacity: 1; transform: scale(1.08);
      background: linear-gradient(90deg, var(--accent-soft) 0%, rgba(255, 255, 255, 0.03) 100%);
      border-left: 4px solid var(--accent);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 12px var(--accent-glow);
    }
    .xmb-sub-item .icon {
      font-size: 18px; width: 24px;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
    }
    .xmb-sub-item.active .icon {
      color: var(--accent-text);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    /* ============ ITENS DA LISTA DE TEMAS ============ */
    .theme-item .ui-btn {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-item .theme-name { flex: 1; }
    .theme-item .theme-check {
      display: none;
      color: var(--accent-text);
      text-shadow: 0 0 10px var(--accent-glow);
      font-size: 14px;
    }
    .theme-item.is-active-theme .theme-check { display: inline-block; }
    .theme-item.is-active-theme {
      border-color: var(--accent-border);
    }

    .ui-btn {
      background: transparent;
      border: none;
      color: inherit; font: inherit;
      width: 100%; text-align: left;
      padding: 0; margin: 0;
      cursor: pointer;
      font-weight: 500;
    }

    .file-input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .file-input-wrapper input[type="file"] {
      position: absolute; left: 0; top: 0;
      opacity: 0; width: 100%; height: 100%;
      cursor: pointer;
    }

    .info-content { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .info-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); }
    .info-value { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

    /* ============ GAMEPAD ============ */
    .gamepad-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 100;
      display: flex; flex-direction: column; justify-content: flex-end;
      pointer-events: none;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    .gamepad-overlay.hidden {
      opacity: 0; visibility: hidden;
      pointer-events: none !important;
    }
    .btn, .analog-container { pointer-events: auto; }

    .pad-container {
      display: flex; justify-content: space-between; align-items: flex-end;
      width: 100%; padding-bottom: 20px;
    }
    .pad-wing { display: flex; flex-direction: column; gap: 12px; }
    .left-wing { align-items: flex-start; }
    .right-wing { align-items: flex-end; }

    .btn {
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.05s ease, background-color 0.05s ease;
    }
    .btn:active, .btn.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      transform: scale(0.92);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .bumper-group { display: flex; gap: 8px; }
    .btn-bumper { width: clamp(50px, 12vmin, 70px); height: clamp(35px, 8vmin, 45px); border-radius: 12px; font-size: 13px; }

    .analog-container {
      position: relative;
      width: clamp(110px, 28vmin, 130px);
      height: clamp(110px, 28vmin, 130px);
      display: flex; justify-content: center; align-items: center;
    }
    .analog-base {
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.75) 100%);
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      position: relative;
      display: flex; justify-content: center; align-items: center;
    }
    .analog-thumb {
      width: 52px; height: 52px;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      position: absolute;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      will-change: transform;
    }

    .action-buttons { position: relative; width: clamp(120px, 30vmin, 140px); height: clamp(120px, 30vmin, 140px); }
    .action-buttons .btn { position: absolute; width: clamp(42px, 11vmin, 55px); height: clamp(42px, 11vmin, 55px); }
    
    #triangle { top: 0; left: 50%; transform: translateX(-50%); color: #4ade80; } 
    #square { left: 0; top: 50%; transform: translateY(-50%); color: #f472b6; }   
    #circle { right: 0; top: 50%; transform: translateY(-50%); color: #f87171; }   
    #cross { bottom: 0; left: 50%; transform: translateX(-50%); color: #60a5fa; }    

    .center-buttons { display: flex; gap: 14px; align-self: flex-end; margin-bottom: 15px; }
    .btn-center { width: clamp(58px, 14vmin, 72px); height: clamp(28px, 6vmin, 34px); border-radius: 16px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
    .btn-menu { background: linear-gradient(135deg, var(--menu-gradient-1), var(--menu-gradient-2)); border-color: var(--accent-border); }
    .btn-stick { width: clamp(40px, 9vmin, 50px); height: clamp(40px, 9vmin, 50px); font-size: 11px; margin-top: 4px; }

    .floating-menu-btn {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 95;
      padding: 10px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--menu-gradient-1), var(--menu-gradient-2));
      border: 1.5px solid var(--accent-border);
      color: #fff;
      font-size: 11px; font-weight: 800;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 10px var(--accent-glow);
      transition: transform 0.1s ease, background-color 0.1s ease;
      font-family: var(--font-display);
    }
    .floating-menu-btn:active {
      transform: scale(0.94);
      filter: brightness(1.3);
    }
  </style>
</head>
<body class="xmb-open">

  <div class="canvas-container">
    <canvas id="display"></canvas>
  </div>

  <canvas id="ps3-wave-canvas" class="active"></canvas>

  <!-- Marca d'água (o tema decide se mostra; só aparece com body.xmb-open) -->
  <div id="theme-watermark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="46" stroke-width="2.2"/>
        <circle cx="50" cy="50" r="41" stroke-width="0.9" opacity="0.7"/>
        <path d="M50 12 C 34 12, 22 22, 20 36 C 18 48, 22 58, 30 64 C 26 60, 22 52, 24 42 C 26 30, 36 22, 50 22 C 64 22, 74 30, 76 42 C 78 52, 74 60, 70 64 C 78 58, 82 48, 80 36 C 78 22, 66 12, 50 12 Z"/>
        <path d="M40 34 L 44 30 L 48 34" stroke-width="1.8"/>
        <path d="M52 34 L 56 30 L 60 34" stroke-width="1.8"/>
        <path d="M34 22 L 28 14 M 66 22 L 72 14" stroke-width="2"/>
        <path d="M44 44 Q 50 48, 56 44" stroke-width="1.8"/>
        <path d="M42 50 Q 50 56, 58 50" stroke-width="1.4"/>
        <path d="M38 48 Q 30 52, 24 50 M 62 48 Q 70 52, 76 50" stroke-width="1.2"/>
        <path d="M50 66 C 38 66, 30 74, 34 82 C 38 90, 52 90, 58 84 C 64 78, 60 70, 52 70 C 46 70, 44 76, 48 80" stroke-width="1.6"/>
      </g>
    </svg>
  </div>

  <canvas id="theme-embers"></canvas>

  <div id="xmb-overlay" class="xmb-overlay active">
    <div class="xmb-header">
      <div class="xmb-clock" id="xmb-clock">00:00</div>
      <div class="xmb-date" id="xmb-date">01/01</div>
    </div>

    <div class="xmb-container">
      <div class="xmb-horizontal-bar" id="xmb-categories">
        <div class="xmb-nav-item active" onclick="setXMBCategory(0)">
          <span class="icon"><i class="fa-solid fa-gamepad"></i></span>
          <span class="label">Jogos</span>
        </div>
        <div class="xmb-nav-item" onclick="setXMBCategory(1)">
          <span class="icon"><i class="fa-solid fa-gear"></i></span>
          <span class="label">Definições</span>
        </div>
        <div class="xmb-nav-item" onclick="setXMBCategory(2)">
          <span class="icon"><i class="fa-solid fa-tv"></i></span>
          <span class="label">Vídeo</span>
        </div>
        <div class="xmb-nav-item" onclick="setXMBCategory(3)">
          <span class="icon"><i class="fa-solid fa-compact-disc"></i></span>
          <span class="label">Info</span>
        </div>
        <div class="xmb-nav-item" onclick="setXMBCategory(4)">
          <span class="icon"><i class="fa-solid fa-palette"></i></span>
          <span class="label">Temas</span>
        </div>
      </div>

      <div class="xmb-vertical-list" id="xmb-items">
        <!-- Categoria 0: Jogos -->
        <div class="xmb-sub-item active cat-0">
          <span class="icon"><i class="fa-solid fa-folder-open"></i></span>
          <div class="file-input-wrapper ui-btn">
            Carregar ROM / ISO / CHD (✖)
            <input type="file" id="file" title="Carregar Jogo" multiple accept=".bin,.cue,.iso,.chd,.vcd">
          </div>
        </div>

        <!-- Categoria 1: Definições -->
        <div class="xmb-sub-item cat-1" style="display:none;" onclick="togglePauseGame()">
          <span class="icon"><i class="fa-solid fa-pause"></i></span>
          <button id="btn-pause" class="ui-btn">Pausar Emulação</button>
        </div>
        <div class="xmb-sub-item cat-1" style="display:none;" onclick="closeXMB()">
          <span class="icon"><i class="fa-solid fa-play"></i></span>
          <button class="ui-btn">Retomar Jogo (●)</button>
        </div>
        <div class="xmb-sub-item cat-1" style="display:none;" onclick="toggleVirtualGamepad()">
          <span class="icon"><i class="fa-solid fa-gamepad"></i></span>
          <button id="btn-gamepad-toggle" class="ui-btn">Gamepad Virtual: Desativado</button>
        </div>

        <!-- Categoria 2: Vídeo -->
        <div class="xmb-sub-item cat-2" style="display:none;">
          <span class="icon"><i class="fa-solid fa-palette"></i></span>
          <button id="quality" class="ui-btn">Qualidade Visual: Q1</button>
        </div>
        <div class="xmb-sub-item cat-2" style="display:none;" onclick="toggleFullscreen()">
          <span class="icon"><i class="fa-solid fa-expand"></i></span>
          <button class="ui-btn">Modo Tela Cheia</button>
        </div>

        <!-- Categoria 3: Info -->
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-compact-disc"></i></span>
          <div class="info-content"><div class="info-label">Título</div><div class="info-value" id="game-title">Sem Jogo Carregado</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-barcode"></i></span>
          <div class="info-content"><div class="info-label">Serial</div><div class="info-value" id="game-serial">Desconhecido</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-earth-americas"></i></span>
          <div class="info-content"><div class="info-label">Região</div><div class="info-value" id="game-region">Desconhecido</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-database"></i></span>
          <div class="info-content"><div class="info-label">Tipo de CD</div><div class="info-value" id="game-cd-type">PS1 CD-ROM</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-list"></i></span>
          <div class="info-content"><div class="info-label">Faixas</div><div class="info-value" id="game-tracks">0 faixas</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-weight-hanging"></i></span>
          <div class="info-content"><div class="info-label">Tamanho</div><div class="info-value" id="game-filesize">0 Bytes</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-tag"></i></span>
          <div class="info-content"><div class="info-label">ID do Volume</div><div class="info-value" id="game-volume-id">-</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;">
          <span class="icon"><i class="fa-solid fa-building"></i></span>
          <div class="info-content"><div class="info-label">Editora</div><div class="info-value" id="game-publisher">-</div></div>
        </div>
        <div class="xmb-sub-item cat-3" style="display:none;" onclick="refreshCDInfo()">
          <span class="icon"><i class="fa-solid fa-rotate"></i></span>
          <button class="ui-btn">Atualizar Informações</button>
        </div>

        <!-- Categoria 4: Temas (itens gerados dinamicamente pelo ThemeManager) -->
        <!-- Os itens .cat-4 serão injetados aqui -->
      </div>
    </div>
  </div>

  <div id="floating-menu-btn" class="floating-menu-btn">
    <i class="fa-solid fa-bars"></i> Menu
  </div>

  <div class="gamepad-overlay hidden" id="main-ui">
    <div class="pad-container">
      <div class="pad-wing left-wing">
        <div class="bumper-group">
          <div id="l2" class="btn btn-bumper">L2</div>
          <div id="l1" class="btn btn-bumper">L1</div>
        </div>
        <div class="analog-container" id="analogLeft">
          <div class="analog-base"><div class="analog-thumb" id="thumbLeft"></div></div>
        </div>
        <div id="l3" class="btn btn-stick">L3</div>
      </div>

      <div class="center-buttons">
        <div id="btn-menu-trigger" class="btn btn-center btn-menu">MENU</div>
        <div id="start" class="btn btn-center">START</div>
      </div>

      <div class="pad-wing right-wing">
        <div class="bumper-group">
          <div id="r1" class="btn btn-bumper">R1</div>
          <div id="r2" class="btn btn-bumper">R2</div>
        </div>
        <div class="action-buttons">
          <div id="triangle" class="btn">▲</div>
          <div id="square" class="btn">■</div>
          <div id="circle" class="btn">●</div>
          <div id="cross" class="btn">✖</div>
        </div>
        <div id="r3" class="btn btn-stick">R3</div>
      </div>
    </div>
  </div>

  <!-- ==================== THEME MANAGER ==================== -->
  <script type="text/javascript">
    const ThemeManager = (function() {
      const THEME_PREF_KEY = 'xmb_theme';

      const FALLBACK_MANIFEST = {
        defaultTheme: 'ps3',
        themes: [
          { id: 'ps3',           file: 'ps3.json' },
          { id: 'mortal-kombat', file: 'mortal-kombat.json' },
          { id: 'sakura-dream',  file: 'sakura-dream.json' } // <--- NOVO TEMA AQUI
        ]
      };
      
      const FALLBACK_THEMES = {
        'ps3': {

      let themes = {};
      let manifest = null;
      let currentId = null;
      let listeners = [];

      async function loadManifest() {
        try {
          const res = await fetch('temas/temas.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('manifest');
          manifest = await res.json();
        } catch (e) {
          console.warn('[ThemeManager] Usando manifesto embutido (fetch falhou).', e.message);
          manifest = FALLBACK_MANIFEST;
        }
      }

      async function loadOneTheme(meta) {
        try {
          const res = await fetch('temas/' + meta.file, { cache: 'no-cache' });
          if (!res.ok) throw new Error('theme ' + meta.id);
          themes[meta.id] = await res.json();
        } catch (e) {
          console.warn(`[ThemeManager] Fallback para tema "${meta.id}".`, e.message);
          themes[meta.id] = FALLBACK_THEMES[meta.id];
        }
      }

      function notify(theme) { listeners.forEach(fn => { try { fn(theme); } catch(e){} }); }

      function apply(id) {
        const theme = themes[id];
        if (!theme) return;
        currentId = id;

        // 1) CSS variables
        const root = document.documentElement;
        Object.entries(theme.cssVariables || {}).forEach(([k, v]) => root.style.setProperty(k, v));

        // 2) theme-color do navegador
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta && theme.themeColor) meta.setAttribute('content', theme.themeColor);

        // 3) Marca d'água
        const wm = theme.effects && theme.effects.watermark;
        document.body.classList.toggle('theme-has-watermark', !!(wm && wm.enabled));
        if (wm && wm.color) root.style.setProperty('--watermark-color', wm.color);

        // 4) Faíscas/brasas
        const em = theme.effects && theme.effects.embers;
        document.body.classList.toggle('theme-has-embers', !!(em && em.enabled));

        // 5) Persistir
        try { localStorage.setItem(THEME_PREF_KEY, id); } catch (e) {}

        // 6) Atualiza lista no XMB
        renderThemeList();

        // 7) Avisar engines
        notify(theme);
      }

      function cycle() {
        if (!manifest || !manifest.themes || !manifest.themes.length) return;
        const ids = manifest.themes.map(t => t.id);
        const idx = ids.indexOf(currentId);
        const next = ids[(idx + 1) % ids.length];
        if (typeof vibrateDevice === 'function') vibrateDevice();
        apply(next);
      }

      // ============== LISTA DE TEMAS NO XMB ==============
      function renderThemeList() {
        const container = document.getElementById('xmb-items');
        if (!container) return;

        // Remove itens antigos
        container.querySelectorAll('.theme-item').forEach(el => el.remove());

        // Adiciona um item para cada tema
        manifest.themes.forEach(meta => {
          const theme = themes[meta.id];
          if (!theme) return;

          const item = document.createElement('div');
          item.className = 'xmb-sub-item cat-4 theme-item';
          item.style.display = 'none';
          item.dataset.themeId = meta.id;
          if (meta.id === currentId) item.classList.add('is-active-theme');

          // Cor de preview do tema (accent)
          const previewColor = (theme.cssVariables && theme.cssVariables['--accent']) || '#fff';

          item.innerHTML = `
            <span class="icon">
              <i class="fa-solid ${theme.icon || 'fa-palette'}"
                 style="color:${previewColor}; text-shadow: 0 0 10px ${previewColor};"></i>
            </span>
            <button class="ui-btn">
              <span class="theme-name">${theme.name || meta.id}</span>
              <i class="fa-solid fa-check theme-check"></i>
            </button>
          `;

          item.addEventListener('click', () => selectTheme(meta.id));
          container.appendChild(item);
        });

        // Se a categoria atual for Temas, reaplica visibilidade
        if (typeof currentCategoryIndex !== 'undefined' && currentCategoryIndex === 4) {
          // Reaplica o filtro display:none / flex para refletir os novos itens
          document.querySelectorAll('.xmb-sub-item').forEach(el => el.style.display = 'none');
          document.querySelectorAll('.cat-4').forEach((el, idx) => {
            el.style.display = 'flex';
            el.classList.toggle('active', idx === 0);
          });
        }
      }

      function selectTheme(id) {
        if (!themes[id]) return;
        if (typeof vibrateDevice === 'function') vibrateDevice();
        apply(id);
      }

      function getCurrent() { return themes[currentId] || null; }
      function getAll()     { return manifest ? manifest.themes.map(t => themes[t.id]).filter(Boolean) : []; }
      function getCurrentId(){ return currentId; }
      function onChange(fn) { listeners.push(fn); }

      async function init() {
        await loadManifest();
        await Promise.all(manifest.themes.map(loadOneTheme));
        let initial = manifest.defaultTheme;
        try {
          const saved = localStorage.getItem(THEME_PREF_KEY);
          if (saved && themes[saved]) initial = saved;
        } catch (e) {}
        apply(initial);
        renderThemeList();
      }

      return { init, apply, cycle, selectTheme, getCurrent, getAll, getCurrentId, onChange };
    })();
  </script>

  <!-- ==================== WAVE ENGINE ==================== -->
  <script type="text/javascript">
    const PS3WaveEngine = (function() {
      const canvas = document.getElementById('ps3-wave-canvas');
      const ctx = canvas.getContext('2d');
      let animId = null;
      let time = 0;

      let config = {
        background: { stops:['#020d1f','#082545','#010612'], positions:[0,0.5,1] },
        waves: [
          { amplitude:70, freq:0.0018, speed:0.012, offset:0, color1:'rgba(56,189,248,0.35)', color2:'rgba(3,105,161,0.05)', heightRatio:0.52 }
        ],
        waveSpeedMultiplier: 1,
        effects: { glowPulses:{enabled:false} }
      };

      function setTheme(t) { if (t) config = t; }

      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      function drawWave() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const bg = config.background || { stops:['#000'], positions:[0] };
        const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bg.stops.forEach((c, i) => bgGrad.addColorStop(bg.positions[i] ?? (i / Math.max(1, bg.stops.length - 1)), c));
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const speedMul = config.waveSpeedMultiplier || 1;
        time += speedMul;

        (config.waves || []).forEach(w => {
          ctx.beginPath();
          ctx.moveTo(0, canvas.height);
          for (let x = 0; x <= canvas.width; x += 6) {
            const y = Math.sin(x * w.freq + time * w.speed + w.offset) * w.amplitude
                    + Math.cos(x * w.freq * 0.6 + time * w.speed * 0.7) * (w.amplitude * 0.6)
                    + (canvas.height * w.heightRatio);
            ctx.lineTo(x, y);
          }
          ctx.lineTo(canvas.width, canvas.height);
          ctx.closePath();
          const waveGrad = ctx.createLinearGradient(0, canvas.height * 0.3, 0, canvas.height);
          waveGrad.addColorStop(0, w.color1);
          waveGrad.addColorStop(1, w.color2);
          ctx.fillStyle = waveGrad;
          ctx.fill();
        });

        const gp = config.effects && config.effects.glowPulses;
        if (gp && gp.enabled) {
          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < (gp.count || 6); i++) {
            const cx = (Math.sin(time * 0.01 + i * 1.7) * 0.5 + 0.5) * canvas.width;
            const cy = canvas.height * (0.75 + Math.sin(time * 0.008 + i) * 0.08);
            const r  = 120 + Math.sin(time * 0.02 + i) * 40;
            const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            glow.addColorStop(0, gp.color || 'rgba(255,180,80,0.18)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalCompositeOperation = 'source-over';
        }

        animId = requestAnimationFrame(drawWave);
      }

      return {
        setTheme,
        start() { canvas.classList.add('active'); if (!animId) drawWave(); },
        stop() {
          canvas.classList.remove('active');
          if (animId) { cancelAnimationFrame(animId); animId = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
        }
      };
    })();
  </script>

  <!-- ==================== EMBERS ENGINE ==================== -->
  <script type="text/javascript">
    const ThemeEmbers = (function() {
      const canvas = document.getElementById('theme-embers');
      const ctx = canvas.getContext('2d');
      let animId = null;
      let particles = [];
      let config = null;

      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      function setTheme(t) {
        config = (t && t.effects && t.effects.embers) || null;
        if (!config || !config.enabled) {
          particles = [];
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      function spawn() {
        const max = (config && config.maxParticles) || 60;
        if (particles.length > max) return;
        const hueStart = (config && config.hueStart) ?? 10;
        const hueEnd   = (config && config.hueEnd)   ?? 50;
        particles.push({
          x: Math.random() * canvas.width,
          y: canvas.height + 10,
          vy: -(0.5 + Math.random() * 1.6),
          vx: (Math.random() - 0.5) * 0.6,
          life: 1,
          decay: 0.003 + Math.random() * 0.005,
          size: 1 + Math.random() * 2.5,
          hue: hueStart + Math.random() * (hueEnd - hueStart)
        });
      }

      function tick() {
        const shouldRun = config && config.enabled
          && document.body.classList.contains('theme-has-embers')
          && document.body.classList.contains('xmb-open');

        if (!shouldRun) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles = [];
          animId = requestAnimationFrame(tick);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const chance = config.spawnChance ?? 0.6;
        if (Math.random() < chance) spawn();

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx + Math.sin(p.y * 0.01) * 0.4;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0 || p.y < -20) { particles.splice(i, 1); continue; }
          const alpha = p.life * 0.9;
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 6);
          grad.addColorStop(0, `hsla(${p.hue}, 100%, 65%, ${alpha})`);
          grad.addColorStop(0.5, `hsla(${p.hue - 10}, 100%, 50%, ${alpha * 0.5})`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 6, 0, Math.PI * 2);
          ctx.fill();
        }

        animId = requestAnimationFrame(tick);
      }

      return { setTheme, start() { if (!animId) tick(); } };
    })();

    ThemeManager.onChange(theme => {
      PS3WaveEngine.setTheme(theme);
      ThemeEmbers.setTheme(theme);
    });
    ThemeEmbers.start();
  </script>

  <!-- ==================== XMB + GAMEPAD + ANALÓGICO ==================== -->
  <script type="text/javascript">
    let isXMBOpen = true;
    let currentCategoryIndex = 0;
    let currentItemIndex = 0;
    const TOTAL_CATEGORIES = 5; // 0=Jogos, 1=Definições, 2=Vídeo, 3=Info, 4=Temas

    /* ==================== GAMEPAD VIRTUAL ==================== */
    const GAMEPAD_PREF_KEY = 'xmb_virtual_gamepad';
    let virtualGamepadEnabled = false;

    function applyGamepadVisibility() {
      const mainUi = document.getElementById('main-ui');
      const btn = document.getElementById('btn-gamepad-toggle');
      const floating = document.getElementById('floating-menu-btn');

      if (virtualGamepadEnabled) {
        mainUi.classList.remove('hidden');
        if (btn) btn.textContent = 'Gamepad Virtual: Ativado';
        if (floating) floating.style.display = 'none';
      } else {
        mainUi.classList.add('hidden');
        if (btn) btn.textContent = 'Gamepad Virtual: Desativado';
        if (floating) floating.style.display = 'flex';
      }
    }

    function toggleVirtualGamepad() {
      vibrateDevice();
      virtualGamepadEnabled = !virtualGamepadEnabled;
      applyGamepadVisibility();
      try { localStorage.setItem(GAMEPAD_PREF_KEY, virtualGamepadEnabled ? '1' : '0'); } catch (e) {}
    }

    (function restoreGamepadPref() {
      try { if (localStorage.getItem(GAMEPAD_PREF_KEY) === '1') virtualGamepadEnabled = true; } catch (e) {}
      applyGamepadVisibility();
    })();

    function updateXMBClock() {
      const now = new Date();
      document.getElementById('xmb-clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('xmb-date').textContent = now.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
    }
    setInterval(updateXMBClock, 1000);
    updateXMBClock();

    function vibrateDevice() { if (navigator.vibrate) navigator.vibrate(20); }

    function openXMB() {
      isXMBOpen = true;
      document.body.classList.add('xmb-open');
      document.getElementById('xmb-overlay').classList.add('active');
      PS3WaveEngine.start();
      setXMBCategory(currentCategoryIndex);
    }

    function closeXMB() {
      isXMBOpen = false;
      document.body.classList.remove('xmb-open');
      document.getElementById('xmb-overlay').classList.remove('active');
      PS3WaveEngine.stop();
    }

    function toggleXMB() {
      vibrateDevice();
      if (!isXMBOpen) {
        if (typeof window.togglePause === 'function' && typeof window.isRunning === 'function') {
          if (window.isRunning()) window.togglePause();
        }
        openXMB();
      } else {
        closeXMB();
        if (typeof window.togglePause === 'function' && typeof window.isRunning === 'function') {
          if (!window.isRunning()) window.togglePause();
        }
      }
    }

    function setXMBCategory(catIndex) {
      if (!isXMBOpen) return;
      currentCategoryIndex = catIndex;
      currentItemIndex = 0;
      document.getElementById('xmb-categories').style.transform = `translateX(${-catIndex * 135}px)`;
      document.querySelectorAll('.xmb-nav-item').forEach((el, idx) => el.classList.toggle('active', idx === catIndex));
      document.querySelectorAll('.xmb-sub-item').forEach(el => el.style.display = 'none');
      document.querySelectorAll(`.cat-${catIndex}`).forEach((el, idx) => {
        el.style.display = 'flex';
        el.classList.toggle('active', idx === 0);
      });
      updateVerticalScroll();
    }

    function updateVerticalScroll() {
      const visibleItems = document.querySelectorAll(`.cat-${currentCategoryIndex}`);
      visibleItems.forEach((el, idx) => el.classList.toggle('active', idx === currentItemIndex));
      document.getElementById('xmb-items').style.transform = `translateY(${-currentItemIndex * 62}px)`;
    }

    function togglePauseGame() {
      vibrateDevice();
      if (typeof window.togglePause !== 'function') return;
      const nowRunning = window.togglePause();
      const btn = document.getElementById('btn-pause');
      if (btn) btn.textContent = nowRunning ? 'Pausar Emulação' : 'Retomar Emulação';
    }

    function refreshCDInfo() {
      vibrateDevice();
      if (window.GameInfo) {
        window.GameInfo.extractCDInfo();
        window.GameInfo.parseISO9660();
        window.GameInfo.updateUIOnLoad();
      }
    }

    function toggleFullscreen() {
      vibrateDevice();
      let el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    document.getElementById('file').addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        closeXMB();
        if (typeof window.togglePause === 'function' && typeof window.isRunning === 'function') {
          if (!window.isRunning()) window.togglePause();
        }
        const loadedFile = e.target.files[0];
        if (window.GameInfo) {
          window.GameInfo.onFileLoaded(loadedFile.name, loadedFile.size);
          let attempts = 0;
          const cdrWatcher = setInterval(function () {
            attempts++;
            if (window.cdr && window.cdr.tracks) {
              window.GameInfo.onFileLoaded(loadedFile.name, loadedFile.size);
              clearInterval(cdrWatcher);
            } else if (attempts > 20) clearInterval(cdrWatcher);
          }, 500);
        }
      }
    });

    const menuBtn = document.getElementById('btn-menu-trigger');
    menuBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); toggleXMB(); });

    const floatingMenuBtn = document.getElementById('floating-menu-btn');
    floatingMenuBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); toggleXMB(); });

    function navigateXMBMenu(dir) {
      if (!isXMBOpen) return;
      vibrateDevice();
      const visibleItems = document.querySelectorAll(`.cat-${currentCategoryIndex}`);

      if (dir === 'right' && currentCategoryIndex < TOTAL_CATEGORIES - 1) setXMBCategory(currentCategoryIndex + 1);
      else if (dir === 'left' && currentCategoryIndex > 0) setXMBCategory(currentCategoryIndex - 1);
      else if (dir === 'down' && currentItemIndex < visibleItems.length - 1) { currentItemIndex++; updateVerticalScroll(); }
      else if (dir === 'up' && currentItemIndex > 0) { currentItemIndex--; updateVerticalScroll(); }
      else if (dir === 'enter') {
        const activeItem = visibleItems[currentItemIndex];
        if (activeItem) {
          const fileInput = activeItem.querySelector('input[type="file"]');
          if (fileInput) fileInput.click(); else activeItem.click();
        }
      }
      else if (dir === 'back') closeXMB();
    }

    ['cross', 'circle'].forEach(btnId => {
      const btn = document.getElementById(btnId);
      btn.addEventListener('pointerdown', (e) => {
        if (isXMBOpen) {
          e.stopPropagation();
          if (btnId === 'cross') navigateXMBMenu('enter');
          if (btnId === 'circle') navigateXMBMenu('back');
        }
      });
    });

    /* ==================== ANALÓGICO ==================== */
    const analogBase = document.getElementById('analogLeft');
    const analogThumb = document.getElementById('thumbLeft');
    let activePointerId = null;
    let baseRect = null;
    let currentKeys = { up: false, down: false, left: false, right: false };
    let xmbCooldown = 0;

    analogBase.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activePointerId = e.pointerId;
      analogBase.setPointerCapture(e.pointerId);
      baseRect = analogBase.getBoundingClientRect();
      processAnalogInput(e);
    });

    analogBase.addEventListener('pointermove', (e) => {
      if (e.pointerId === activePointerId) { e.preventDefault(); processAnalogInput(e); }
    });

    const stopAnalog = (e) => {
      if (e.pointerId === activePointerId) {
        activePointerId = null;
        analogThumb.style.transform = `translate(0px, 0px)`;
        dispatchGamepadAnalog(0, 0, { up: false, down: false, left: false, right: false });
      }
    };
    analogBase.addEventListener('pointerup', stopAnalog);
    analogBase.addEventListener('pointercancel', stopAnalog);

    function processAnalogInput(e) {
      const centerX = baseRect.left + baseRect.width / 2;
      const centerY = baseRect.top + baseRect.height / 2;
      const maxRadius = (baseRect.width / 2) - 10;
      let deltaX = e.clientX - centerX;
      let deltaY = e.clientY - centerY;
      let distance = Math.hypot(deltaX, deltaY);
      if (distance > maxRadius) { deltaX = (deltaX / distance) * maxRadius; deltaY = (deltaY / distance) * maxRadius; }
      analogThumb.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      let normX = deltaX / maxRadius, normY = deltaY / maxRadius;
      const deadzone = 0.32;
      let keys = { up: false, down: false, left: false, right: false };
      if (distance > (maxRadius * deadzone)) {
        let angle = Math.atan2(normY, normX) * (180 / Math.PI);
        if (angle < -22.5 && angle > -157.5) keys.up = true;
        if (angle > 22.5 && angle < 157.5) keys.down = true;
        if (Math.abs(angle) > 112.5) keys.left = true;
        if (Math.abs(angle) < 67.5) keys.right = true;
      }
      dispatchGamepadAnalog(normX, normY, keys);
    }

    function dispatchGamepadAnalog(x, y, keys) {
      if (isXMBOpen) {
        const now = Date.now();
        if (now - xmbCooldown > 220) {
          if (keys.up && !currentKeys.up) { navigateXMBMenu('up'); xmbCooldown = now; }
          if (keys.down && !currentKeys.down) { navigateXMBMenu('down'); xmbCooldown = now; }
          if (keys.left && !currentKeys.left) { navigateXMBMenu('left'); xmbCooldown = now; }
          if (keys.right && !currentKeys.right) { navigateXMBMenu('right'); xmbCooldown = now; }
        }
        currentKeys = keys;
        return;
      }

      if (window.VirtualGamepad) {
        if (typeof window.VirtualGamepad.setAnalog === 'function') {
          window.VirtualGamepad.setAnalog(0, x, y);
        } else if (typeof window.VirtualGamepad.setAxis === 'function') {
          window.VirtualGamepad.setAxis(0, x); window.VirtualGamepad.setAxis(1, y);
        }
        if (keys.up !== currentKeys.up) keys.up ? window.VirtualGamepad.press('up') : window.VirtualGamepad.release('up');
        if (keys.down !== currentKeys.down) keys.down ? window.VirtualGamepad.press('down') : window.VirtualGamepad.release('down');
        if (keys.left !== currentKeys.left) keys.left ? window.VirtualGamepad.press('left') : window.VirtualGamepad.release('left');
        if (keys.right !== currentKeys.right) keys.right ? window.VirtualGamepad.press('right') : window.VirtualGamepad.release('right');
      }
      currentKeys = keys;
    }

    // Inicializa
    ThemeManager.init().then(() => {
      PS3WaveEngine.start();
    }).catch(err => {
      console.error('[ThemeManager] init falhou:', err);
      PS3WaveEngine.start();
    });
  </script>
